<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Notepad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#0b0d14">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="notepad.css">
</head>
<body class="page-notepad">
    <div class="header">
        <a href="#" class="brand-logo">
            <div class="logo-icon">
                <img src="assets/logo.png" alt="logo">
            </div>
            <span class="brand-name">Hash Cracker</span>
        </a>
        
        <div class="header-actions">
            <button class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
                
                <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24"><path d="M12 18C8.68629 18 6 15.3137 6 12C6 8.68629 8.68629 6 12 6C15.3137 6 18 8.68629 18 12C18 15.3137 15.3137 18 12 18ZM11 1H13V4H11V1ZM11 20H13V23H11V20ZM3.51472 4.92893L4.92893 3.51472L7.05025 5.63604L5.63604 7.05025L3.51472 4.92893ZM16.9497 18.364L18.364 16.9497L20.4853 19.0711L19.0711 20.4853L16.9497 18.364ZM19.0711 3.51472L20.4853 4.92893L18.364 7.05025L16.9497 5.63604L19.0711 3.51472ZM5.63604 16.9497L7.05025 18.364L4.92893 20.4853L3.51472 19.0711L5.63604 16.9497ZM23 11V13H20V11H23ZM4 11V13H1V11H4Z"></path></svg>
                <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" style="display:none" viewBox="0 0 24 24" width="24"><path d="M11.3807 2.01886C9.91573 3.38768 9 5.3369 9 7.49999C9 11.6421 12.3579 15 16.5 15C18.6631 15 20.6123 14.0843 21.9811 12.6193C21.6613 17.8537 17.3149 22 12 22C6.47715 22 2 17.5228 2 12C2 6.68514 6.14629 2.33869 11.3807 2.01886Z"></path></svg> 
                
            </button>
        </div>
    </div>
    
  <section class="hero-home hero-notepad">
    <h1>Notepad</h1>
    <p>Quick notes that live only in this browser — nothing is uploaded, nothing syncs.</p>
  </section>

  <main class="container">
    <div class="toolbar">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 -960 960 960" aria-hidden="true"><path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/></svg>
        <input id="searchInput" class="search" type="search" placeholder="Search your notes" aria-label="Search notes">
        <button id="searchClear" class="search-clear" type="button" aria-label="Clear search" hidden>✕</button>
      </div>
      <span class="note-count" id="noteCount"></span>
    </div>

    <section id="notesGrid" class="notes-grid" aria-live="polite">
      <!-- Notes cards are rendered here by script -->
    </section>
  </main>

  <footer class="notepad-footer">
    <span id="storageHint">0 notes · saved in this browser</span>
  </footer>

  <!-- Floating Action Button -->
  <button id="fabBtn" class="fab" title="Add note" aria-label="Add new note">
    <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"/></svg>
  </button>

  <!-- Add / Edit Modal -->
  <div id="noteModal" class="modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-panel editor-panel">
      <header class="modal-header">
        <h2 id="modalTitle">Add Note</h2>
        <button id="closeModalBtn" class="icon-btn" aria-label="Close modal">✕</button>
      </header>

      <form id="noteForm" class="modal-body">
        <label class="field">
          <span class="field-label">Title</span>
          <input id="noteTitle" type="text" maxlength="120" placeholder="Note title" />
        </label>

        <label class="field field-grow">
          <span class="field-label">
            Content
            <span class="char-count" id="charCount">0 characters</span>
          </span>
          <textarea id="noteContent" rows="8" placeholder="Write something…"></textarea>
        </label>

        <div class="modal-actions">
          <span class="autosave-hint" id="autosaveHint" hidden>Unsaved changes</span>
          <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
          <button type="submit" id="saveBtn" class="btn btn-primary">Save note</button>
        </div>
      </form>
    </div>
  </div>

  <!-- View Modal -->
  <div id="viewModal" class="modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="viewTitle">
    <div class="modal-panel">
      <header class="modal-header">
        <h2 id="viewTitle">Title</h2>
        <div class="modal-head-actions">
          <button id="copyViewBtn" class="icon-btn" title="Copy content" aria-label="Copy content">
            <svg class="i-copy" viewBox="0 -960 960 960" aria-hidden="true"><path d="M360-240q-33 0-56.5-23.5T280-320v-480q0-33 23.5-56.5T360-880h360q33 0 56.5 23.5T800-800v480q0 33-23.5 56.5T720-240H360Zm0-80h360v-480H360v480ZM200-80q-33 0-56.5-23.5T120-160v-560h80v560h440v80H200Zm160-240v-480 480Z"/></svg>
            <svg class="i-check" viewBox="0 -960 960 960" aria-hidden="true" hidden><path d="M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z"/></svg>
          </button>
          <button id="closeViewBtn" class="icon-btn" aria-label="Close view">✕</button>
        </div>
      </header>

      <div class="modal-body modal-view">
        <p id="viewContent" class="view-content"></p>
        <div class="view-meta">
          <span id="viewDate" class="view-date"></span>
          <div class="view-actions">
            <button id="editFromViewBtn" class="btn btn-secondary">Edit</button>
            <button id="deleteFromViewBtn" class="btn btn-danger">Delete</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Confirm Delete Modal -->
  <div id="confirmModal" class="modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="modal-panel">
      <header class="modal-header">
        <h2 id="confirmTitle">Delete note?</h2>
        <button id="closeConfirmBtn" class="icon-btn" aria-label="Close confirm">✕</button>
      </header>
      <div class="modal-body">
        <p>Are you sure you want to delete this note?</p>
        <div class="modal-actions">
          <button id="cancelDeleteBtn" class="btn btn-secondary">Cancel</button>
          <button id="confirmDeleteBtn" class="btn btn-danger">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Custom Alert Modal -->
  <div id="alertModal" class="modal" aria-hidden="true" role="alertdialog" aria-modal="true" aria-labelledby="alertMessage">
    <div class="modal-panel small">
      <h3 id="alertMessage">Alert message here</h3>
      <div class="modal-actions">
        <button id="alertOkBtn" class="btn btn-primary">OK</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  
  <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item">
            <svg viewBox="0 0 24 24">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
            <span class="nav-label">Home</span>
        </a>
        
        <a href="encrypt.html" class="nav-item">
            <svg viewBox="0 -960 960 960" width="24px"><path d="M480-80q-139-35-229.5-159.5T160-516v-244l320-120 320 120v244q0 152-90.5 276.5T480-80Zm0-84q97-30 162-118.5T718-480H480v-315l-240 90v207q0 7 2 18h238v316Z"/></svg>
            <span class="nav-label">Encrypt</span>
        </a>
        
        <a href="notepad.html" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h168q13-36 43.5-58t68.5-22q38 0 68.5 22t43.5 58h168q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm80-80h280v-80H280v80Zm0-160h400v-80H280v80Zm0-160h400v-80H280v80Zm200-190q13 0 21.5-8.5T510-820q0-13-8.5-21.5T480-850q-13 0-21.5 8.5T450-820q0 13 8.5 21.5T480-790ZM200-200v-560 560Z"/></svg>
            <span class="nav-label">Note</span>
        </a>

        <a href="docs.html" class="nav-item">
            <svg viewBox="0 0 24 24">
                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/>
            </svg>
            <span class="nav-label">Docs</span>
        </a>               
        
    </div>
  
  <script src="common.js"></script>
  <script src="notepad.js"></script>
</body>
</html>
